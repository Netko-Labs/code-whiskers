name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened, edited]
  push:
    branches: [main]
  # Dispatched by dependabot-lockfile.yml after it rewrites a Dependabot branch.
  workflow_dispatch:

jobs:
  quality:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run fmt-lint
      - run: bun run test
      - name: every schema change ships its migration
        run: |
          bun run repo db:generate --app studio
          bun run repo db:generate --app whiskers
          drift=$(git status --porcelain -- packages/studio/repository/src/db/drizzle packages/whiskers/repository/src/db/drizzle)
          test -z "$drift" || { echo "$drift"; echo 'schema changed without a committed migration'; exit 1; }

  commitlint:
    if: github.event_name != 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha || 'origin/main' }} --to ${{ github.event.pull_request.head.sha || 'HEAD' }}
